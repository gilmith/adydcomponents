<div class="container">
<div class="adnd-navbar" role="tablist">
    @for(tab of tabs(); track $index; let idx = $index){
    <button type="button"
            class="nav-link adnd-nav-tab"
            role="tab"
            [class.active]="activeTab() === idx"
            [attr.aria-selected]="activeTab() === idx"
            (click)="selectTab(idx)">
        <span class="adnd-tab-seal" aria-hidden="true"></span>
        {{ tab.title() }}
    </button>
    }
</div>

<div class="tab-content adnd-tab-panel">
    @if (tabs()[activeTab()]; as tab) {
    <div class="tab-pane active" role="tabpanel">
        <ng-container [ngTemplateOutlet]="tab.template" />
    </div>
    }
</div>
</div>
