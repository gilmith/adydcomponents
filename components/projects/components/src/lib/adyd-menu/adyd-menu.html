<div class="adnd-dropdown" [class.open]="isOpen()">
    <!-- Botón que alterna la señal local isOpen -->
    <button class="adnd-dropdown-toggle"
            type="button"
            (click)="toggleMenu()"
            [attr.aria-expanded]="isOpen()"
            aria-haspopup="menu">
        <i class="bi bi-person-fill" aria-hidden="true"></i>
        <span>{{ menuName() }}</span>
        <i class="bi bi-chevron-down" aria-hidden="true"></i>
    </button>

    <!-- Menú flotante: la clase .open controla su visibilidad -->
    <div class="adnd-dropdown-menu"
         [class.adnd-dropdown-menu-end]="align() === 'end'"
         role="menu">
        @for (item of menuElements(); track $index) {
            <a class="adnd-dropdown-item"
               role="menuitem"
               [routerLink]="item.link"
               (click)="close()">{{ item.text }}</a>
        }
        @if (logout()) {
            <hr class="menu-divider my-1">
            <button type="button"
                    class="adnd-dropdown-item adnd-dropdown-item--danger"
                    role="menuitem"
                    (click)="handleLogout()">Logout</button>
        }
    </div>
</div>
