<a class="btn-solid theme-primary" href="#" role="button" data-bs-toggle="menu" aria-expanded="false">
    {{menuName()}}
</a>
<div class="menu">
    @for (item of menuElements(); track $index){
        <a class="menu-item" [routerLink]="item.link">{{item.text}}</a>
    }
    @if(this.logout()){
        <a class="menu-item" (click)="this.handleLogout()">Logout</a>
    }
</div>
