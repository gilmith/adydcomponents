<div class="card" [id]="id()">
  <div class="card-body">
    <h4 class="card-title text-center" [textContent]="title()"></h4>
    <img class="card-img-top" [src]="imageUrl()" [alt]="title()" />
    <p class="card-text" [textContent]="description()"></p>
    @if (showAction()) {
      <div class="d-grid gap-2 col-6 mx-auto">
        <button type="button" class="theme-primary btn-solid" (click)="onSelect()">
          Seleccionar
        </button>
          <button type="button" (click)="onSelect()" *AdminDirective>
              Editar
          </button>
      </div>

    }
  </div>
</div>
