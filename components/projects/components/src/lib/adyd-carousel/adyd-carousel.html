<div class="adyd-carousel">
  <div
    #viewport
    class="adyd-carousel__viewport"
    [style.--adyd-carousel-item-width.px]="itemWidth()"
  >
    <div
      #track
      class="adyd-carousel__track"
      [style.transform]="'translate3d(' + -offset() + 'px, 0, 0)'"
    >
      <ng-content/>
    </div>
  </div>

  @if (showControls()) {
    <button
      class="adyd-carousel__control adyd-carousel__control--prev"
      type="button"
      (click)="prev()"
      aria-label="Anterior"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    </button>

    <button
      class="adyd-carousel__control adyd-carousel__control--next"
      type="button"
      (click)="next()"
      aria-label="Siguiente"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
    </button>
  }
</div>
