<!-- Sprite de iconos de @gilmith/components.
     Referencia desde plantillas: assets/gilmith/icons/icon.svg#<id> -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true">
    <defs>
        <!-- Esquinas de tarjeta -->
        <symbol id="adnd-card-corner" viewBox="0 0 32 32">
            <path fill="currentColor" d="M1,1 L22,1 L18,5 L5,5 L5,18 L1,22 Z"/>
            <path fill="none" stroke="currentColor" stroke-width="1.6" d="M3,26 C9,26 9,17 17,17 C17,9 26,9 26,3"/>
            <polygon points="10,7 13,10 10,13 7,10" fill="currentColor"/>
        </symbol>

        <!-- Cresta superior de tarjeta -->
        <symbol id="adnd-card-crest" viewBox="0 0 120 26">
            <path fill="none" stroke="currentColor" stroke-width="1.6" d="M4,13 L42,13 M78,13 L116,13"/>
            <polygon points="60,2 71,13 60,24 49,13" fill="currentColor"/>
            <polygon points="60,6 67,13 60,20 53,13" fill="#8b1e1e"/>
            <circle cx="60" cy="13" r="2" fill="#f9e6b3"/>
        </symbol>

        <!-- Sello de lacre carmesí -->
        <symbol id="adnd-wax-seal-svg" viewBox="0 0 48 48">
            <path fill="#8b1e1e" stroke="#591010" stroke-width="1.5" d="M24,3 C29,2 34,5 38,8 C42,11 45,16 45,22 C46,28 43,34 39,38 C35,42 29,45 23,45 C17,45 11,42 7,37 C3,33 2,26 3,20 C4,14 7,9 12,6 C16,3 20,4 24,3 Z"/>
            <circle cx="24" cy="24" r="15" fill="none" stroke="#b52b2b" stroke-width="1.5"/>
            <polygon points="24,13 33,24 24,35 15,24" fill="none" stroke="#f3ce65" stroke-width="1.6"/>
            <circle cx="24" cy="24" r="2.5" fill="#f3ce65"/>
        </symbol>

        <!-- Spinner astrolabio: piezas separadas para animarlas con CSS -->
        <symbol id="adnd-astrolabe-outer" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="10 4 2 4"/>
            <circle cx="32" cy="32" r="23" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7"/>
            <polygon points="32,1 34.5,7 29.5,7" fill="currentColor"/>
            <polygon points="32,63 34.5,57 29.5,57" fill="currentColor"/>
            <polygon points="1,32 7,34.5 7,29.5" fill="currentColor"/>
            <polygon points="63,32 57,34.5 57,29.5" fill="currentColor"/>
        </symbol>

        <symbol id="adnd-astrolabe-inner" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 6"/>
            <polygon points="32,13 34,16 32,19 30,16" fill="currentColor"/>
            <polygon points="32,45 34,48 32,51 30,48" fill="currentColor"/>
            <polygon points="13,32 16,34 19,32 16,30" fill="currentColor"/>
            <polygon points="45,32 48,34 51,32 48,30" fill="currentColor"/>
        </symbol>

        <symbol id="adnd-astrolabe-core" viewBox="0 0 64 64">
            <polygon points="32,24 38,32 32,40 26,32" fill="currentColor"/>
            <circle cx="32" cy="32" r="2.5" fill="#f9e6b3"/>
        </symbol>

        <!-- Spinner D20: piezas separadas para animarlas con CSS -->
        <symbol id="adnd-d20-runes" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5"/>
        </symbol>

        <symbol id="adnd-d20-frame" viewBox="0 0 64 64">
            <polygon points="32,8 53,20 53,44 32,56 11,44 11,20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <polygon points="32,17 45,39 19,39" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <line x1="32" y1="8" x2="32" y2="17" stroke="currentColor" stroke-width="1.5"/>
            <line x1="53" y1="20" x2="45" y2="39" stroke="currentColor" stroke-width="1.5"/>
            <line x1="11" y1="20" x2="19" y2="39" stroke="currentColor" stroke-width="1.5"/>
            <line x1="53" y1="44" x2="45" y2="39" stroke="currentColor" stroke-width="1.5"/>
            <line x1="11" y1="44" x2="19" y2="39" stroke="currentColor" stroke-width="1.5"/>
            <line x1="32" y1="56" x2="45" y2="39" stroke="currentColor" stroke-width="1.5"/>
            <line x1="32" y1="56" x2="19" y2="39" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="32" cy="32" r="3" fill="#8b1e1e"/>
        </symbol>

        <!-- Iconos combinados estáticos: las piezas animables son las de arriba -->
        <symbol id="adnd-spinner-astrolabe" viewBox="0 0 64 64">
            <use href="#adnd-astrolabe-outer"/>
            <use href="#adnd-astrolabe-inner"/>
            <use href="#adnd-astrolabe-core"/>
        </symbol>

        <symbol id="adnd-spinner-d20" viewBox="0 0 64 64">
            <use href="#adnd-d20-runes"/>
            <use href="#adnd-d20-frame"/>
        </symbol>

        <!-- Ornamento de esquina genérico -->
        <symbol id="adnd-corner-ornament" viewBox="0 0 24 24">
            <path fill="currentColor" d="M2,2 L14,2 L11,5 L5,5 L5,11 L2,14 Z"/>
            <circle cx="8.5" cy="8.5" r="2" fill="currentColor"/>
            <path fill="none" stroke="currentColor" stroke-width="1.5" d="M2,18 C6,18 6,12 12,12 C12,6 18,6 18,2"/>
        </symbol>
    </defs>
</svg>
