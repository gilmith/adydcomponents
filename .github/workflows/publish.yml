name: Publish Library

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gilmith'

      - name: Install dependencies
        working-directory: ./components
        run: npm ci --force

      - name: Set library version from tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ./components
        run: npm pkg set version="${GITHUB_REF_NAME#v}" --prefix projects/components

      - name: Build library
        working-directory: ./components
        run: npm run build

      - name: Publish to GitHub Packages
        working-directory: ./components
        run: npm publish ./dist/components --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
